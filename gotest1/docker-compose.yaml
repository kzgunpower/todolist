version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 14881488
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - todolist-network

  redis:
    image: redis:7-alpine
    container_name: redis
    networks:
      - todolist-network

  db-service:
    build:
      context: ./db-service
    container_name: db-service
    depends_on:
      - postgres
    environment:
      - PG_HOST=postgres
    networks:
      - todolist-network

  api-service:
    build:
      context: ./api-service
    container_name: api-service
    depends_on:
      - redis
      - db-service
    environment:
      - REDIS_URL=redis:6379
      - DB_URL=http://db-service:8081
    networks:
      - todolist-network

  nginx:
    image: nginx:1.23-alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/index.html:/usr/share/nginx/html/index.html
    depends_on:
      - api-service
    networks:
      - todolist-network

networks:
  todolist-network:
    driver: bridge

volumes:
  postgres-data: